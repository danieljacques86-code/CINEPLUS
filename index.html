<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Player Pro</title>
    <style>
        /* Estilos do Painel de Controle e Layout */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #111;
            color: #fff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h2 {
            margin-bottom: 5px;
            color: #E50914;
        }

        /* Caixa do Gerenciador */
        .gerenciador-box {
            background-color: #1c1c1c;
            padding: 15px 25px;
            border-radius: 8px;
            margin-bottom: 25px;
            width: 100%;
            max-width: 750px;
            box-sizing: border-box;
            border: 1px solid #333;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .url-fixa-label {
            font-size: 12px;
            color: #888;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #444;
            background-color: #000;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #E50914;
        }

        button {
            background-color: #E50914;
            color: white;
            border: none;
            padding: 0 25px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #b81d24;
        }

        /* Container do Player de Vídeo */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            border: 1px solid #222;
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <h2>Gerenciador de Conteúdo</h2>
    <p style="color: #aaa; margin-top: 0; margin-bottom: 20px;">Insira o ID para alterar o player em tempo real</p>

    <!-- Painel do Gerenciador -->
    <div class="gerenciador-box">
        <span class="url-fixa-label">URL Base ativa: <strong>https://player.videasy.net/movie/</strong></span>
        <div class="input-group">
            <input type="text" id="idConteudo" placeholder="Cole aqui o ID do filme (Ex: 299534)" value="299534">
            <button onclick="carregarConteudo()">Atualizar Player</button>
        </div>
    </div>

    <!-- Container do Vídeo -->
    <div class="video-container">
        <iframe id="playerVideo" allowfullscreen></iframe>
    </div>

    <script>
        // CONFIGURAÇÃO: Sua URL base fica protegida e fixa aqui
        const URL_BASE = "https://player.videasy.net/movie/";

        // FUNÇÃO GERENCIADORA: Faz a somatória da URL fixa + ID informado
        function carregarConteudo() {
            const inputId = document.getElementById('idConteudo').value.trim();
            const iframe = document.getElementById('playerVideo');

            if (inputId !== "") {
                // Soma (concatena) a URL fixa com o ID digitado
                iframe.src = URL_BASE + inputId;
            } else {
                alert("Por favor, digite um ID válido!");
            }
        }

        // Executa automaticamente ao abrir a página usando o ID inicial do input
        window.onload = carregarConteudo;
    </script>

</body>
</html>
